name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: ctx tests
        run: tests/ctx-test.sh
      - name: install tests
        run: tests/install-test.sh
